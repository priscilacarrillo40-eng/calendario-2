<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Institucional - Público en Tiempo Real</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring { animation: pulse-ring 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased selection:bg-brand-500 selection:text-white">

  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp,
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged,
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      collection,
      query,
      getDocs
    };
    
    window.dispatchEvent(new Event('firebase-loaded'));
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const icons = {
        calendar: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        ),
        plus: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        ),
        chevronLeft: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        ),
        chevronRight: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        ),
        search: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        ),
        palette: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
            <path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.21-.64-1.67-.38-.43-.6-1-.6-1.6 0-1.38 1.12-2.5 2.5-2.5H18c2.21 0 4-1.79 4-4 0-4.97-4.48-9-10-9z"></path>
          </svg>
        ),
        clock: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        ),
        alertTriangle: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        ),
        x: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        ),
        edit: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        ),
        trash: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        ),
        database: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
        ),
        download: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        ),
        check: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        ),
        school: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        ),
        stickyNote: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        ),
        wifi: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        ),
        share: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        ),
        refresh: (
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
            <polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        )
      };
      return icons[name] || null;
    };

    const formatDateKey = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const parseLocalDate = (fechaStr) => {
      if (!fechaStr) return new Date();
      const parts = fechaStr.split('-');
      if (parts.length === 3) {
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      }
      return new Date(fechaStr);
    };

    const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const DIAS_SEMANA = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

    const CATEGORIAS_DEFAULT = {
      jornada: { id: 'jornada', nombre: 'Jornada Institucional', hex: '#8b5cf6' },
      cierre: { id: 'cierre', nombre: 'Cierre de Notas', hex: '#ef4444' },
      acto: { id: 'acto', nombre: 'Acto Escolar', hex: '#f97316' },
      reunion: { id: 'reunion', nombre: 'Reunión de Personal', hex: '#2563eb' },
      evaluacion: { id: 'evaluacion', nombre: 'Evaluaciones / Mesas', hex: '#10b981' },
      importante: { id: 'importante', nombre: 'Fecha Clave', hex: '#d97706' },
      otro: { id: 'otro', nombre: 'Actividad General', hex: '#64748b' }
    };

    const EVENTOS_SEMILLA = [
      {
        id: 'ev-1',
        titulo: 'Jornada Institucional de Evaluación',
        descripcion: 'Análisis de trayectorias pedagógicas del primer trimestre.',
        fecha: formatDateKey(new Date(new Date().getFullYear(), new Date().getMonth(), 12)),
        horaInicio: '08:00',
        horaFin: '12:30',
        jornadaCompleta: false,
        categoria: 'jornada',
        ubicacion: 'SUM Principal',
        importante: true
      },
      {
        id: 'ev-2',
        titulo: 'Cierre de Notas 1° Trimestre',
        descripcion: 'Carga completa de calificaciones en la plataforma.',
        fecha: formatDateKey(new Date(new Date().getFullYear(), new Date().getMonth(), 25)),
        horaInicio: '',
        horaFin: '',
        jornadaCompleta: true,
        categoria: 'cierre',
        ubicacion: 'Dirección',
        importante: true
      },
      {
        id: 'ev-3',
        titulo: 'Reunión de Departamentos',
        descripcion: 'Coordinación de contenidos y proyectos integradores.',
        fecha: formatDateKey(new Date(new Date().getFullYear(), new Date().getMonth(), 18)),
        horaInicio: '14:00',
        horaFin: '16:00',
        jornadaCompleta: false,
        categoria: 'reunion',
        ubicacion: 'Sala de Profesores',
        importante: false
      }
    ];

    function App() {
      const [dbReady, setDbReady] = useState(false);
      const [cargandoNube, setCargandoNube] = useState(true);
      const [conexionEstado, setConexionEstado] = useState('conectando'); // 'conectado', 'error', 'conectando'
      const [ultimaSinc, setUltimaSinc] = useState('');

      const [currentDate, setCurrentDate] = useState(new Date());
      const [vistaModo, setVistaModo] = useState('mes');
      
      const [eventos, setEventos] = useState([]);
      const [categoriasMap, setCategoriasMap] = useState(CATEGORIAS_DEFAULT);
      const [notasRapidas, setNotasRapidas] = useState('');

      const [filtroTexto, setFiltroTexto] = useState('');
      const [filtroCategoria, setFiltroCategoria] = useState('todos');
      const [filtroImportancia, setFiltroImportancia] = useState('todos');

      const [modalNuevoAbierto, setModalNuevoAbierto] = useState(false);
      const [modalColoresAbierto, setModalColoresAbierto] = useState(false);
      const [eventoSeleccionado, setEventoSeleccionado] = useState(null);
      const [eventoEditar, setEventoEditar] = useState(null);
      const [eventoAEliminar, setEventoAEliminar] = useState(null);
      const [notificacion, setNotificacion] = useState(null);

      const firebaseRef = useRef(null);
      const eventoUrlProcesado = useRef(false);
      const debounceNotasRef = useRef(null);
      const unsubscribersRef = useRef([]);

      const mostrarNotificacion = (texto, tipo = 'exito') => {
        setNotificacion({ texto, tipo });
        setTimeout(() => setNotificacion(null), 4000);
      };

      const compartirEvento = (evento) => {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('eventoId', evento.id);
        const shareUrl = `${window.location.origin}${window.location.pathname}?${urlParams.toString()}`;
        
        const textArea = document.createElement("textarea");
        textArea.value = shareUrl;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          mostrarNotificacion("¡Enlace único copiado al portapapeles!");
        } catch (err) {
          mostrarNotificacion("No se pudo copiar el enlace", "error");
        }
        document.body.removeChild(textArea);
      };

      const exportarICS = (evento) => {
        const formatICSDate = (fechaStr, horaStr) => {
          const cleanDate = fechaStr.replace(/-/g, '');
          if (!horaStr) return cleanDate;
          const cleanTime = horaStr.replace(/:/g, '') + '00';
          return `${cleanDate}T${cleanTime}`;
        };

        let dtStart = '';
        let dtEnd = '';

        if (evento.jornadaCompleta || !evento.horaInicio) {
          dtStart = `;VALUE=DATE:${formatICSDate(evento.fecha)}`;
          const dateObj = parseLocalDate(evento.fecha);
          dateObj.setDate(dateObj.getDate() + 1);
          dtEnd = `;VALUE=DATE:${formatDateKey(dateObj).replace(/-/g, '')}`;
        } else {
          dtStart = `:${formatICSDate(evento.fecha, evento.horaInicio)}`;
          const horaFinFinal = evento.horaFin || evento.horaInicio;
          dtEnd = `:${formatICSDate(evento.fecha, horaFinFinal)}`;
        }

        const escapeText = (str) => (str || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');

        const icsData = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Calendario Institucional//ES',
          'CALSCALE:GREGORIAN',
          'BEGIN:VEVENT',
          `UID:${evento.id}@calendario-institucional`,
          `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
          `DTSTART${dtStart}`,
          `DTEND${dtEnd}`,
          `SUMMARY:${escapeText(evento.titulo)}`,
          `DESCRIPTION:${escapeText(evento.descripcion)}`,
          `LOCATION:${escapeText(evento.ubicacion)}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `${evento.titulo.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        mostrarNotificacion("Archivo .ics descargado.");
      };

      useEffect(() => {
        const initAndListen = async () => {
          if (!window.FirebaseSDK) return;
          const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, doc, onSnapshot, setDoc, getDocs } = window.FirebaseSDK;

          try {
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'calendario-institucional-publico';
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
              apiKey: "AIzaSyDummyKeyForPublicAppPlaceholder",
              authDomain: "public-app.firebaseapp.com",
              projectId: "public-app-id",
              storageBucket: "public-app.appspot.com",
              messagingSenderId: "123456789",
              appId: "1:123:web:abc"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            firebaseRef.current = { db, appId, auth };

            const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;
            if (initialToken) {
              await signInWithCustomToken(auth, initialToken);
            } else {
              await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, async (user) => {
              if (user) {
                setDbReady(true);

                // Mandated Firestore Collection Paths: /artifacts/{appId}/public/data/{collectionName}
                const colEventos = collection(db, 'artifacts', appId, 'public', 'data', 'eventos');
                const colCategorias = collection(db, 'artifacts', appId, 'public', 'data', 'categorias');
                const colNotas = collection(db, 'artifacts', appId, 'public', 'data', 'notas');

                // Check if database is empty to seed initial sample data ONCE
                try {
                  const snapEv = await getDocs(colEventos);
                  if (snapEv.empty) {
                    for (const ev of EVENTOS_SEMILLA) {
                      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'eventos', ev.id), ev);
                    }
                  }

                  const snapCat = await getDocs(colCategorias);
                  if (snapCat.empty) {
                    for (const catKey of Object.keys(CATEGORIAS_DEFAULT)) {
                      await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categorias', catKey), CATEGORIAS_DEFAULT[catKey]);
                    }
                  }
                } catch (e) {
                  console.warn("Error al verificar semillas iniciales:", e);
                }

                // Real-time listener for EVENTS across ALL clients
                const unsubEventos = onSnapshot(colEventos, (snapshot) => {
                  const list = [];
                  snapshot.forEach(docSnap => {
                    list.push({ id: docSnap.id, ...docSnap.data() });
                  });
                  setEventos(list);
                  setCargandoNube(false);
                  setConexionEstado('conectado');
                  setUltimaSinc(new Date().toLocaleTimeString());

                  // URL parameter direct link handler
                  if (!eventoUrlProcesado.current && list.length > 0) {
                    const params = new URLSearchParams(window.location.search);
                    let targetId = params.get('eventoId');
                    if (!targetId && window.location.hash) {
                      const match = window.location.hash.match(/#\/evento\/(.+)/);
                      if (match) targetId = match[1];
                    }
                    if (targetId) {
                      const evEncontrado = list.find(e => e.id === targetId);
                      if (evEncontrado) {
                        setEventoSeleccionado(evEncontrado);
                        if (evEncontrado.fecha) {
                          const parsedDate = parseLocalDate(evEncontrado.fecha);
                          setCurrentDate(new Date(parsedDate.getFullYear(), parsedDate.getMonth(), 1));
                        }
                        eventoUrlProcesado.current = true;
                      }
                    }
                  }
                }, (err) => {
                  console.error("Error en Snapshot Eventos:", err);
                  setConexionEstado('error');
                  setCargandoNube(false);
                });

                // Real-time listener for CATEGORIES
                const unsubCategorias = onSnapshot(colCategorias, (snapshot) => {
                  const catObj = {};
                  snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    catObj[d.id || docSnap.id] = d;
                  });
                  setCategoriasMap(Object.keys(catObj).length > 0 ? catObj : CATEGORIAS_DEFAULT);
                }, (err) => console.error("Error en Snapshot Categorías:", err));

                // Real-time listener for SHARED PUBLIC NOTES
                const unsubNotas = onSnapshot(colNotas, (snapshot) => {
                  if (!snapshot.empty) {
                    snapshot.forEach(docSnap => {
                      if (docSnap.id === 'global_note') {
                        setNotasRapidas(docSnap.data().contenido || '');
                      }
                    });
                  } else {
                    setNotasRapidas("• Entregar planificaciones el viernes.\n• Consultar listas de asistencia.");
                  }
                }, (err) => console.error("Error en Snapshot Notas:", err));

                unsubscribersRef.current = [unsubEventos, unsubCategorias, unsubNotas];
              }
            });
          } catch (e) {
            console.error("Error al conectar Firebase:", e);
            setConexionEstado('error');
            setCargandoNube(false);
          }
        };

        if (window.FirebaseSDK) {
          initAndListen();
        } else {
          window.addEventListener('firebase-loaded', initAndListen);
          return () => window.removeEventListener('firebase-loaded', initAndListen);
        }

        return () => {
          unsubscribersRef.current.forEach(u => u && u());
        };
      }, []);

      const guardarNotasEnNube = (nuevoTexto) => {
        setNotasRapidas(nuevoTexto);
        
        if (debounceNotasRef.current) clearTimeout(debounceNotasRef.current);

        debounceNotasRef.current = setTimeout(async () => {
          if (firebaseRef.current && dbReady) {
            try {
              const { db, appId } = firebaseRef.current;
              const { doc, setDoc } = window.FirebaseSDK;
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notas', 'global_note'), {
                contenido: nuevoTexto,
                actualizado: new Date().toISOString()
              });
              setUltimaSinc(new Date().toLocaleTimeString());
            } catch (err) {
              console.error("Error guardando nota:", err);
            }
          }
        }, 500);
      };

      const handleGuardarEvento = async (datosEvento, nuevaCategoriaObj = null) => {
        let catIdFinal = datosEvento.categoria;

        if (nuevaCategoriaObj) {
          const newId = 'cat-' + Date.now();
          const nuevaCat = { id: newId, nombre: nuevaCategoriaObj.nombre, hex: nuevaCategoriaObj.hex };
          setCategoriasMap(prev => ({ ...prev, [newId]: nuevaCat }));
          catIdFinal = newId;

          if (firebaseRef.current && dbReady) {
            try {
              const { db, appId } = firebaseRef.current;
              const { doc, setDoc } = window.FirebaseSDK;
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categorias', newId), nuevaCat);
            } catch (e) {
              console.error("Error guardando categoría:", e);
            }
          }
        }

        const evId = datosEvento.id || 'ev-' + Date.now();
        const eventoAlineado = {
          ...datosEvento,
          id: evId,
          categoria: catIdFinal
        };

        if (firebaseRef.current && dbReady) {
          try {
            const { db, appId } = firebaseRef.current;
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'eventos', evId), eventoAlineado);
            mostrarNotificacion(datosEvento.id ? "Evento actualizado permanentemente." : "Evento publicado en red global.");
          } catch (err) {
            console.error("Error guardando evento en la nube:", err);
            mostrarNotificacion("Error al guardar evento en la nube", "error");
          }
        }

        setModalNuevoAbierto(false);
        setEventoEditar(null);
      };

      const handleEliminarEvento = async () => {
        if (!eventoAEliminar) return;
        const targetId = eventoAEliminar.id;

        if (firebaseRef.current && dbReady) {
          try {
            const { db, appId } = firebaseRef.current;
            const { doc, deleteDoc } = window.FirebaseSDK;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'eventos', targetId));
            mostrarNotificacion("Evento eliminado de la red global.");
          } catch (err) {
            console.error("Error eliminando en la nube:", err);
            mostrarNotificacion("Error al eliminar evento en la nube.", "error");
          }
        }

        setEventoAEliminar(null);
        setEventoSeleccionado(null);
      };

      const mesAnterior = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
      const mesSiguiente = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
      const irAHoy = () => setCurrentDate(new Date());

      const diasCalendario = useMemo(() => {
        const año = currentDate.getFullYear();
        const mes = currentDate.getMonth();

        const primerDiaMes = new Date(año, mes, 1);
        const ultimoDiaMes = new Date(año, mes + 1, 0);

        let diaSemanaInicio = primerDiaMes.getDay() - 1;
        if (diaSemanaInicio === -1) diaSemanaInicio = 6;

        const dias = [];
        const diaUltimoMesAnterior = new Date(año, mes, 0).getDate();

        for (let i = diaSemanaInicio - 1; i >= 0; i--) {
          dias.push({ fecha: new Date(año, mes - 1, diaUltimoMesAnterior - i), esMesActual: false });
        }

        for (let i = 1; i <= ultimoDiaMes.getDate(); i++) {
          dias.push({ fecha: new Date(año, mes, i), esMesActual: true });
        }

        const totalCeldas = dias.length > 35 ? 42 : 35;
        const diasRestantes = totalCeldas - dias.length;
        for (let i = 1; i <= diasRestantes; i++) {
          dias.push({ fecha: new Date(año, mes + 1, i), esMesActual: false });
        }

        return dias;
      }, [currentDate]);

      const eventosFiltrados = useMemo(() => {
        return eventos.filter(ev => {
          const coincideTexto = (ev.titulo || '').toLowerCase().includes(filtroTexto.toLowerCase()) ||
                                (ev.descripcion && ev.descripcion.toLowerCase().includes(filtroTexto.toLowerCase()));
          const coincideCategoria = filtroCategoria === 'todos' || ev.categoria === filtroCategoria;
          const coincideImportancia = filtroImportancia === 'todos' ||
                                      (filtroImportancia === 'alta' && ev.importante) ||
                                      (filtroImportancia === 'normal' && !ev.importante);

          return coincideTexto && coincideCategoria && coincideImportancia;
        });
      }, [eventos, filtroTexto, filtroCategoria, filtroImportancia]);

      const eventosImportantes = useMemo(() => {
        return eventos.filter(ev => ev.importante).sort((a, b) => a.fecha.localeCompare(b.fecha));
      }, [eventos]);

      const proximosEventos = useMemo(() => {
        const hoyStr = formatDateKey(new Date());
        return eventos
          .filter(ev => ev.fecha >= hoyStr)
          .sort((a, b) => a.fecha.localeCompare(b.fecha))
          .slice(0, 5);
      }, [eventos]);

      const exportarEventosCSV = () => {
        const headers = ["ID", "Titulo", "Fecha", "Hora Inicio", "Hora Fin", "Categoria", "Ubicacion", "Importante", "Descripcion"];
        const rows = eventos.map(ev => [
          ev.id,
          `"${(ev.titulo || '').replace(/"/g, '""')}"`,
          ev.fecha,
          ev.horaInicio || '',
          ev.horaFin || '',
          categoriasMap[ev.categoria]?.nombre || ev.categoria,
          `"${(ev.ubicacion || '').replace(/"/g, '""')}"`,
          ev.importante ? "SI" : "NO",
          `"${(ev.descripcion || '').replace(/"/g, '""')}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `calendario_institucional_${formatDateKey(new Date())}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        mostrarNotificacion("Eventos exportados a CSV con éxito.");
      };

      return (
        <div className="min-h-screen flex flex-col relative pb-10">

          {notificacion && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-xl border text-sm font-semibold flex items-center gap-2 animate-bounce ${
              notificacion.tipo === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
            }`}>
              <Icon name={notificacion.tipo === 'error' ? 'alertTriangle' : 'check'} className="w-5 h-5" />
              <span>{notificacion.texto}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">

                  <Icon name="school" className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-brand-600">Gestión Institucional</span>
                    
                    {conexionEstado === 'conectado' ? (
                      <span className="inline-flex items-center gap-1.5 text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full border border-emerald-300">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Sincronizado en Tiempo Real
                      </span>
                    ) : conexionEstado === 'error' ? (
                      <span className="inline-flex items-center gap-1 text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">

                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">
                        <Icon name="refresh" className="w-3 h-3 animate-spin" /> Conectando...
                      </span>
                    )}

                </div>

                >
                  <Icon name="download" className="w-4 h-4 text-slate-500" />
                  <span className="hidden sm:inline">Exportar CSV</span>
                </button>

                <div className="px-3 py-1.5 text-xs font-semibold bg-brand-50 text-brand-700 border border-brand-200 rounded-lg flex items-center gap-1.5">
                  <Icon name="database" className="w-4 h-4 text-brand-600" />
                  <span>Base Global</span>
                  {ultimaSinc && <span className="text-[10px] text-slate-400">({ultimaSinc})</span>}
                </div>
              </div>
            </div>
          </header>

          <div className="bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-3">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
              <div className="relative w-full md:w-64">
                <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input 
                  type="text" 
                  placeholder="Buscar eventos..."
                  value={filtroTexto}
                  onChange={(e) => setFiltroTexto(e.target.value)}

                />
              </div>

              <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <select

                  onChange={(e) => setFiltroCategoria(e.target.value)}

                >
                  <option value="todos">Todas las Categorías</option>
                  {Object.keys(categoriasMap).map(key => (
                    <option key={key} value={key}>{categoriasMap[key]?.nombre}</option>

                </select>

                <select 
                  value={filtroImportancia}
                  onChange={(e) => setFiltroImportancia(e.target.value)}

                >
                  <option value="todos">Toda Prioridad</option>
                  <option value="alta">🚨 Altas / Claves</option>
                  <option value="normal">Normales</option>
                </select>

                <div className="flex items-center border border-slate-200 rounded-xl overflow-hidden bg-slate-50 p-1">
                  <button
                    onClick={() => setVistaModo('mes')}
                    className={`px-3 py-1 text-xs font-semibold rounded-lg transition ${vistaModo === 'mes' ? 'bg-white shadow-xs text-brand-600' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    Mes
                  </button>
                  <button
                    onClick={() => setVistaModo('lista')}
                    className={`px-3 py-1 text-xs font-semibold rounded-lg transition ${vistaModo === 'lista' ? 'bg-white shadow-xs text-brand-600' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    Agenda

                </div>

                <button
                  onClick={() => setModalColoresAbierto(true)}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
                >
                  <Icon name="palette" className="w-4 h-4 text-brand-600" />
                  <span>Categorías</span>
                </button>

                <button 
                  onClick={() => { setEventoEditar(null); setModalNuevoAbierto(true); }}
                  className="ml-auto bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-sm transition"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>Nuevo Evento</span>
                </button>
              </div>
            </div>
          </div>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <div className="lg:col-span-3 flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden relative">
              {cargandoNube && (
                <div className="absolute inset-0 bg-white/70 backdrop-blur-xs z-20 flex items-center justify-center">
                  <div className="flex items-center gap-2 text-brand-600 font-bold text-xs bg-white px-4 py-3 rounded-2xl shadow-lg border border-slate-100">
                    <div className="w-4 h-4 border-2 border-brand-600 border-t-transparent rounded-full animate-spin"></div>
                    <span>Cargando eventos desde la nube global...</span>
                  </div>
                </div>
              )}

              <div className="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between">
                <h2 className="text-xl font-bold text-slate-800">
                  {MESES[currentDate.getMonth()]} <span className="text-slate-400 font-normal">{currentDate.getFullYear()}</span>
                </h2>

                <div className="flex items-center space-x-2">
                  <button 
                    onClick={irAHoy}
                    className="px-3 py-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition"
                  >
                    Hoy
                  </button>
                  <div className="flex items-center border border-slate-200 rounded-lg overflow-hidden">
                    <button onClick={mesAnterior} className="p-1.5 hover:bg-slate-50 text-slate-600 border-r border-slate-200 transition">
                      <Icon name="chevronLeft" className="w-5 h-5" />
                    </button>
                    <button onClick={mesSiguiente} className="p-1.5 hover:bg-slate-50 text-slate-600 transition">
                      <Icon name="chevronRight" className="w-5 h-5" />
                    </button>
                  </div>
                </div>
              </div>

              {vistaModo === 'mes' ? (
                <div className="flex-1 p-3 sm:p-4">
                  <div className="grid grid-cols-7 mb-2 text-center">
                    {DIAS_SEMANA.map((dia, idx) => (
                      <div key={idx} className="py-1 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                        {dia}
                      </div>
                    ))}
                  </div>

                  <div className="grid grid-cols-7 gap-1.5 auto-rows-fr">
                    {diasCalendario.map((item, index) => {
                      const strFecha = formatDateKey(item.fecha);
                      const hoyStr = formatDateKey(new Date());
                      const esHoy = hoyStr === strFecha;
                      const eventosDia = eventosFiltrados.filter(ev => ev.fecha === strFecha);

                      return (
                        <div 
                          key={index} 
                          onClick={(e) => {
                            if (e.target.tagName !== 'BUTTON' && !e.target.closest('button') && item.esMesActual) {
                              setEventoEditar({ fecha: strFecha });
                              setModalNuevoAbierto(true);
                            }
                          }}
                          className={`min-h-[100px] p-2 border rounded-xl flex flex-col justify-between transition cursor-pointer relative ${
                            !item.esMesActual 
                              ? 'bg-slate-50/50 border-slate-100 text-slate-300 opacity-60' 
                              : esHoy 
                                ? 'bg-brand-50/70 border-brand-300 text-slate-900 ring-2 ring-brand-500/20' 
                                : 'bg-white border-slate-100 text-slate-700 hover:border-brand-200 hover:bg-slate-50/50'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <span className={`text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${
                              esHoy ? 'bg-brand-600 text-white shadow-xs' : ''
                            }`}>
                              {item.fecha.getDate()}
                            </span>

                            {item.esMesActual && (
                              <button 
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setEventoEditar({ fecha: strFecha });
                                  setModalNuevoAbierto(true);
                                }}
                                className="text-slate-300 hover:text-brand-600 transition p-0.5"
                              >
                                <Icon name="plus" className="w-4 h-4" />
                              </button>
                            )}
                          </div>

                          <div className="mt-1 space-y-1 overflow-y-auto max-h-[72px]">
                            {eventosDia.map(ev => {
                              const cat = categoriasMap[ev.categoria] || CATEGORIAS_DEFAULT.otro;
                              return (
                                <button
                                  key={ev.id}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setEventoSeleccionado(ev);
                                  }}
                                  style={{
                                    backgroundColor: `${cat.hex || '#2563eb'}1a`,
                                    color: cat.hex || '#2563eb',
                                    borderColor: `${cat.hex || '#2563eb'}40`
                                  }}
                                  className={`w-full text-left px-1.5 py-0.5 rounded border text-[11px] font-semibold truncate transition hover:opacity-80 flex items-center gap-1 ${
                                    ev.importante ? 'ring-1 ring-red-400 font-bold' : ''
                                  }`}
                                >
                                  {ev.importante && <span>🚨</span>}
                                  <span className="truncate">{ev.titulo}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ) : (
                <div className="p-4 sm:p-6 divide-y divide-slate-100">
                  {eventosFiltrados.length === 0 ? (
                    <div className="text-center py-12 text-slate-400">
                      <Icon name="calendar" className="w-12 h-12 mx-auto mb-3 stroke-1 text-slate-300" />
                      <p className="font-semibold text-sm">No se encontraron eventos institucionales.</p>
                    </div>
                  ) : (
                    eventosFiltrados.map(ev => {
                      const cat = categoriasMap[ev.categoria] || CATEGORIAS_DEFAULT.otro;
                      return (
                        <div 
                          key={ev.id}
                          onClick={() => setEventoSeleccionado(ev)}
                          className="py-3.5 flex items-center justify-between hover:bg-slate-50 px-3 rounded-xl transition cursor-pointer"
                        >
                          <div className="flex items-center space-x-3.5">
                            <div className="w-3 h-10 rounded-full shrink-0" style={{ backgroundColor: cat.hex || '#2563eb' }}></div>
                            <div>
                              <div className="flex items-center gap-2 mb-0.5">
                                <span 
                                  style={{ backgroundColor: `${cat.hex || '#2563eb'}1a`, color: cat.hex || '#2563eb', borderColor: `${cat.hex || '#2563eb'}40` }}
                                  className="px-2 py-0.5 rounded text-[10px] font-bold border"
                                >
                                  {cat.nombre}
                                </span>
                                {ev.importante && (
                                  <span className="text-[10px] bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded-full">
                                    🚨 PRIORITARIO
                                  </span>
                                )}
                              </div>
                              <h3 className="font-bold text-slate-800 text-sm">{ev.titulo}</h3>
                              {ev.descripcion && <p className="text-xs text-slate-500 line-clamp-1">{ev.descripcion}</p>}
                            </div>
                          </div>

                          <div className="flex items-center gap-3 shrink-0">
                            <div className="text-right">
                              <span className="text-xs font-bold text-slate-700 block">{ev.fecha}</span>
                              <span className="text-[11px] text-slate-400">
                                {ev.jornadaCompleta ? 'Jornada Completa' : `${ev.horaInicio || ''} ${ev.horaFin ? `- ${ev.horaFin}` : ''}`}
                              </span>
                            </div>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                compartirEvento(ev);
                              }}
                              className="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition"
                              title="Compartir evento"

                              <Icon name="share" className="w-4 h-4" />
                            </button>
                          </div>

                      );

                  )}

              )}
            </div>

            <div className="lg:col-span-1 space-y-6">
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div className="flex items-center space-x-2 mb-3 pb-2 border-b border-slate-100">
                  <div className="p-1.5 bg-red-100 text-red-600 rounded-lg">
                    <Icon name="alertTriangle" className="w-4 h-4" />
                  </div>
                  <h3 className="font-bold text-slate-800 text-sm">Fechas Destacadas</h3>
                </div>

                {eventosImportantes.length === 0 ? (
                  <p className="text-xs text-slate-400 italic py-2">No hay fechas prioritarias registradas.</p>
                ) : (
                  <div className="space-y-2.5">
                    {eventosImportantes.map(ev => (
                      <div 
                        key={ev.id} 
                        onClick={() => setEventoSeleccionado(ev)}
                        className="p-3 bg-red-50/50 border border-red-100 hover:border-red-200 rounded-xl cursor-pointer transition"
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-red-600 bg-red-100 px-2 py-0.5 rounded-full">
                            🚨 Clave
                          </span>
                          <span className="text-[11px] text-slate-500 font-semibold">{ev.fecha}</span>
                        </div>
                        <h4 className="text-xs font-bold text-slate-800">{ev.titulo}</h4>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">

                    <Icon name="clock" className="w-4 h-4" />
                  </div>
                  <h3 className="font-bold text-slate-800 text-sm">Próximos Eventos</h3>

                {proximosEventos.length === 0 ? (

                  <div className="space-y-2.5">

                      const cat = categoriasMap[ev.categoria] || CATEGORIAS_DEFAULT.otro;
                      return (
                        <div 
                          key={ev.id}
                          onClick={() => setEventoSeleccionado(ev)}

                          <div className="flex-1 min-w-0">

                            <p className="text-[10px] text-slate-500">{ev.fecha} {ev.horaInicio && `• ${ev.horaInicio} hs`}</p>
                          </div>
                        </div>
                      );
                    })}

              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <div className="p-1.5 bg-amber-100 text-amber-700 rounded-lg">

                    </div>
                    <h3 className="font-bold text-slate-800 text-sm">Notas Públicas Compartidas</h3>
                  </div>
                  <span className="text-[10px] text-emerald-600 font-bold flex items-center gap-1 bg-emerald-50 px-2 py-0.5 rounded-full">
                    <Icon name="check" className="w-3 h-3" /> Auto-Guardado

                ></textarea>
                <p className="text-[10px] text-slate-400 mt-1.5 italic">Lo que escribas aquí se sincroniza en vivo en todos los navegadores.</p>
              </div>

            </div>
          </main>

          {eventoSeleccionado && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">

                  <div className="flex items-center space-x-2">
                    {eventoSeleccionado.importante && <span className="text-sm">🚨</span>}

                  <button onClick={() => setEventoSeleccionado(null)} className="text-slate-400 hover:text-slate-600">

                  </button>

                <div className="space-y-3 text-xs">
                  <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <span className="font-bold text-slate-500">Fecha:</span>
                    <span className="font-semibold text-slate-800">{eventoSeleccionado.fecha}</span>

                  <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">

                  {eventoSeleccionado.ubicacion && (
                    <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                      <span className="font-bold text-slate-500">Ubicación:</span>
                      <span className="font-semibold text-slate-800">{eventoSeleccionado.ubicacion}</span>

                      <span className="font-bold text-slate-500 block mb-1">Descripción:</span>
                      <p className="text-slate-700 whitespace-pre-line">{eventoSeleccionado.descripcion}</p>

                <div className="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-100">

                      <span>Editar</span>

          {eventoAEliminar && (

                    <Icon name="alertTriangle" className="w-6 h-6" />
                  </div>
                  <h3 className="text-base font-bold text-slate-800">¿Eliminar Evento?</h3>
                </div>

                <p className="text-xs text-slate-600 mb-4">

                </p>

                <div className="flex items-center justify-end space-x-2">
                  <button 
                    onClick={() => setEventoAEliminar(null)}
                    className="px-3.5 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition"

                    Cancelar

                    onClick={handleEliminarEvento}

    function FormularioEvento({ eventoInicial, categoriasMap, onGuardar, onCerrar }) {
      const primerCategoriaId = Object.keys(categoriasMap)[0] || 'jornada';

      const [titulo, setTitulo] = useState(eventoInicial?.titulo || '');
      const [fecha, setFecha] = useState(eventoInicial?.fecha || formatDateKey(new Date()));
      const [horaInicio, setHoraInicio] = useState(eventoInicial?.horaInicio || '08:00');
      const [horaFin, setHoraFin] = useState(eventoInicial?.horaFin || '12:00');
      const [jornadaCompleta, setJornadaCompleta] = useState(eventoInicial?.jornadaCompleta || false);
      const [categoria, setCategoria] = useState(eventoInicial?.categoria || primerCategoriaId);
      
      const [actividadPersonalizada, setActividadPersonalizada] = useState('');
      const [colorPersonalizado, setColorPersonalizado] = useState('#2563eb');

      const [ubicacion, setUbicacion] = useState(eventoInicial?.ubicacion || '');
      const [descripcion, setDescripcion] = useState(eventoInicial?.descripcion || '');
      const [importante, setImportante] = useState(eventoInicial?.importante || false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!titulo.trim()) return;

        let nuevaCatObj = null;
        if (categoria === 'NUEVA_CATEGORIA') {
          if (!actividadPersonalizada.trim()) return;
          nuevaCatObj = {
            nombre: actividadPersonalizada.trim(),
            hex: colorPersonalizado
          };
        }

        const datos = {
          id: eventoInicial?.id || null,
          titulo: titulo.trim(),
          fecha,
          horaInicio: jornadaCompleta ? '' : horaInicio,
          horaFin: jornadaCompleta ? '' : horaFin,
          jornadaCompleta,
          categoria,
          ubicacion: ubicacion.trim(),
          descripcion: descripcion.trim(),
          importante
        };

        onGuardar(datos, nuevaCatObj);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
              <h3 className="text-base font-bold text-slate-800">
                {eventoInicial?.id ? 'Editar Evento' : 'Nuevo Evento'}
              </h3>
              <button onClick={onCerrar} className="text-slate-400 hover:text-slate-600 p-1">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Título del Evento *</label>
                <input 
                  type="text" 
                  required
                  placeholder="Ej. Jornada Institucional"
                  value={titulo}
                  onChange={(e) => setTitulo(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Categoría *</label>
                <select 
                  value={categoria}
                  onChange={(e) => setCategoria(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                >
                  {Object.keys(categoriasMap).map(key => (
                    <option key={key} value={key}>{categoriasMap[key]?.nombre}</option>
                  ))}
                  <option value="NUEVA_CATEGORIA">+ Crear nueva categoría...</option>
                </select>
              </div>

              {categoria === 'NUEVA_CATEGORIA' && (
                <div className="p-3 bg-brand-50/60 border border-brand-200 rounded-xl space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-brand-900 mb-1">Nombre de Nueva Categoría</label>
                    <input 
                      type="text"
                      required
                      placeholder="Ej. Proyecto de Lectura"
                      value={actividadPersonalizada}
                      onChange={(e) => setActividadPersonalizada(e.target.value)}
                      className="w-full px-3 py-1.5 bg-white border border-brand-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-brand-900 mb-1">Color</label>
                    <div className="flex items-center gap-2">
                      <input 
                        type="color"
                        value={colorPersonalizado}
                        onChange={(e) => setColorPersonalizado(e.target.value)}
                        className="w-8 h-8 rounded border cursor-pointer p-0.5 bg-white"
                      />
                      <span className="text-xs font-mono font-semibold text-slate-600">{colorPersonalizado}</span>
                    </div>
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Fecha *</label>
                <input 
                  type="date" 
                  required
                  value={fecha}
                  onChange={(e) => setFecha(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                />
              </div>

              <div className="flex items-center space-x-2">
                <input 
                  type="checkbox" 
                  id="jornadaCompleta"
                  checked={jornadaCompleta}
                  onChange={(e) => {
                    const checked = e.target.checked;
                    setJornadaCompleta(checked);
                    if (!checked) {
                      if (!horaInicio) setHoraInicio('08:00');
                      if (!horaFin) setHoraFin('12:00');
                    }
                  }}
                  className="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500"
                />
                <label htmlFor="jornadaCompleta" className="text-xs font-semibold text-slate-700 cursor-pointer">
                  Jornada Completa (Sin horario específico)
                </label>
              </div>

              {!jornadaCompleta && (
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Hora Inicio</label>
                    <input 
                      type="time" 
                      value={horaInicio}
                      onChange={(e) => setHoraInicio(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Hora Fin</label>
                    <input 
                      type="time" 
                      value={horaFin}
                      onChange={(e) => setHoraFin(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Ubicación (Opcional)</label>
                <input 
                  type="text" 
                  placeholder="Ej. SUM, Laboratorio"
                  value={ubicacion}
                  onChange={(e) => setUbicacion(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Descripción</label>
                <textarea 
                  rows="3"
                  placeholder="Detalles adicionales..."
                  value={descripcion}
                  onChange={(e) => setDescripcion(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                ></textarea>
              </div>

              <div className="flex items-center space-x-2 pt-1">
                <input 
                  type="checkbox" 
                  id="importante"
                  checked={importante}
                  onChange={(e) => setImportante(e.target.checked)}
                  className="w-4 h-4 text-red-600 rounded border-slate-300 focus:ring-red-500"
                />
                <label htmlFor="importante" className="text-xs font-bold text-red-600 cursor-pointer flex items-center gap-1">
                  <span>🚨 Marcar como Evento Prioritario / Clave</span>
                </label>
              </div>

              <div className="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
                <button 
                  type="button"
                  onClick={onCerrar}
                  className="px-3.5 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition"
                >
                  Cancelar
                </button>
                <button 
                  type="submit"
                  className="px-4 py-2 text-xs font-bold bg-brand-600 hover:bg-brand-700 text-white rounded-xl transition shadow-sm"
                >
                  {eventoInicial?.id ? 'Guardar Cambios' : 'Publicar Evento'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ModalGestionColores({ categoriasMap, setCategoriasMap, firebaseRef, dbReady, mostrarNotificacion, onCerrar }) {
      const [nombre, setNombre] = useState('');
      const [color, setColor] = useState('#2563eb');
      const [idEditando, setIdEditando] = useState(null);
      const [nombreEdit, setNombreEdit] = useState('');
      const [colorEdit, setColorEdit] = useState('#2563eb');

      const handleCrearCategoria = async (e) => {
        e.preventDefault();
        const nomLimpio = nombre.trim();
        if (!nomLimpio) return;

        const newId = 'cat-' + Date.now();
        const nuevaCat = { id: newId, nombre: nomLimpio, hex: color };

        if (firebaseRef.current && dbReady) {
          try {
            const { db, appId } = firebaseRef.current;
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categorias', newId), nuevaCat);
            mostrarNotificacion("Categoría creada permanentemente.");
          } catch (err) {
            console.error("Error guardando categoría:", err);
          }
        }

        setNombre('');
        setColor('#2563eb');
      };

      const handleGuardarEdicion = async (id) => {
        const nomLimpio = nombreEdit.trim();
        if (!nomLimpio) return;

        const catActualizada = { id, nombre: nomLimpio, hex: colorEdit };

        if (firebaseRef.current && dbReady) {
          try {
            const { db, appId } = firebaseRef.current;
            const { doc, setDoc } = window.FirebaseSDK;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categorias', id), catActualizada);
            mostrarNotificacion("Categoría actualizada.");
          } catch (err) {
            console.error("Error actualizando categoría:", err);
          }
        }

        setIdEditando(null);
      };

      const handleEliminarCategoria = async (id) => {
        setCategoriasMap(prev => {
          const copia = { ...prev };
          delete copia[id];
          return copia;
        });

        if (firebaseRef.current && dbReady) {
          try {
            const { db, appId } = firebaseRef.current;
            const { doc, deleteDoc } = window.FirebaseSDK;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'categorias', id));
            mostrarNotificacion("Categoría eliminada.");
          } catch (err) {
            console.error("Error eliminando categoría:", err);
          }
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[85vh] flex flex-col">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3 mb-4 shrink-0">
              <div className="flex items-center space-x-2">
                <Icon name="palette" className="w-5 h-5 text-brand-600" />
                <h3 className="text-base font-bold text-slate-800">Administrar Categorías Compartidas</h3>
              </div>
              <button onClick={onCerrar} className="text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleCrearCategoria} className="p-3 bg-slate-50 border border-slate-200 rounded-xl mb-4 shrink-0 space-y-2">
              <span className="text-xs font-bold text-slate-700 block">Nueva Categoría Pública</span>
              <div className="flex items-center gap-2">
                <input 
                  type="text" 
                  placeholder="Nombre de la categoría..."
                  value={nombre}
                  onChange={(e) => setNombre(e.target.value)}
                  className="flex-1 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <input 
                  type="color" 
                  value={color}
                  onChange={(e) => setColor(e.target.value)}
                  className="w-8 h-8 border border-slate-300 rounded-lg cursor-pointer p-0.5 bg-white shrink-0"
                />
                <button 
                  type="submit"
                  className="bg-brand-600 hover:bg-brand-700 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition"
                >
                  Agregar
                </button>
              </div>
            </form>

            <div className="flex-1 overflow-y-auto space-y-2 pr-1">
              {Object.values(categoriasMap).map(cat => {
                if (!cat) return null;
                const esEditando = idEditando === cat.id;

                if (esEditando) {
                  return (
                    <div key={cat.id} className="p-2 bg-brand-50 border border-brand-300 rounded-xl flex items-center gap-2">
                      <input 
                        type="text"
                        value={nombreEdit}
                        onChange={(e) => setNombreEdit(e.target.value)}
                        className="flex-1 px-2 py-1 bg-white border border-brand-300 rounded-lg text-xs"
                      />
                      <input 
                        type="color"
                        value={colorEdit}
                        onChange={(e) => setColorEdit(e.target.value)}
                        className="w-7 h-7 border border-slate-300 rounded-lg cursor-pointer p-0.5 bg-white"
                      />
                      <button 
                        onClick={() => handleGuardarEdicion(cat.id)}
                        className="px-2.5 py-1 bg-brand-600 text-white rounded-lg text-xs font-bold"
                      >
                        Guardar
                      </button>
                      <button 
                        onClick={() => setIdEditando(null)}
                        className="px-2 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-medium"
                      >
                        X
                      </button>
                    </div>
                  );
                }

                return (
                  <div key={cat.id} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                    <div className="flex items-center space-x-2.5">
                      <span className="w-3.5 h-3.5 rounded-full border border-slate-300" style={{ backgroundColor: cat.hex || '#2563eb' }}></span>
                      <span className="text-xs font-bold text-slate-800">{cat.nombre}</span>
                    </div>

                    <div className="flex items-center space-x-1">
                      <button 
                        onClick={() => {
                          setIdEditando(cat.id);
                          setNombreEdit(cat.nombre);
                          setColorEdit(cat.hex || '#2563eb');
                        }}
                        className="p-1 text-slate-400 hover:text-brand-600 rounded-lg transition"
                      >
                        <Icon name="edit" className="w-4 h-4" />
                      </button>
                      <button 
                        onClick={() => handleEliminarCategoria(cat.id)}
                        className="p-1 text-slate-400 hover:text-red-600 rounded-lg transition"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="flex items-center justify-end pt-3 mt-3 border-t border-slate-100 shrink-0">
              <button 
                onClick={onCerrar}
                className="px-4 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition"
              >
                Cerrar
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
